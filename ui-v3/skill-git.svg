<svg xmlns="http://www.w3.org/2000/svg" width="242" height="68" viewBox="0 0 242 68" role="img" aria-label="Git &amp; GitHub">
  <title>Git &amp; GitHub</title>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <rect x="1" y="1" width="240" height="66" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect x="1" y="1" width="240" height="66" rx="10" fill="#161b22" opacity="0.6" />
  
  <!-- Git Branch Icon -->
  <g transform="translate(18, 17)">
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#f05032" opacity="0.15" />
    <path d="M 12 10 L 12 24 M 12 18 L 22 12" stroke="#f05032" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="12" cy="10" r="3" fill="#f05032" />
    <circle cx="12" cy="24" r="3" fill="#f05032" />
    <circle cx="22" cy="12" r="3" fill="#f05032" />
  </g>

  <!-- Title & Subtitle -->
  <text x="64" y="30" class="sans" font-size="15" font-weight="700" fill="#f0f6fc">Git &amp; GitHub</text>
  <text x="64" y="48" class="mono" font-size="10.5" fill="#f05032" font-weight="600">CI/CD &amp; Version Control</text>

  <!-- Accent indicator -->
  <circle cx="222" cy="34" r="3" fill="#f05032" />
</svg>
