<svg xmlns="http://www.w3.org/2000/svg" width="242" height="68" viewBox="0 0 242 68" role="img" aria-label="PostgreSQL">
  <title>PostgreSQL</title>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <rect x="1" y="1" width="240" height="66" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect x="1" y="1" width="240" height="66" rx="10" fill="#161b22" opacity="0.6" />
  
  <!-- PostgreSQL Logo Graphic -->
  <g transform="translate(18, 17)">
    <circle cx="17" cy="17" r="17" fill="#336791" />
    <path d="M 12 10 C 15 8 20 8 22 12 C 24 16 23 23 21 26 L 19 26 L 19 22 C 16 22 14 20 14 18 C 14 14 10 14 9 17 L 8 16 C 8 12 10 10 12 10 Z" fill="#ffffff" />
  </g>

  <!-- Title & Subtitle -->
  <text x="64" y="30" class="sans" font-size="15" font-weight="700" fill="#f0f6fc">PostgreSQL</text>
  <text x="64" y="48" class="mono" font-size="10.5" fill="#336791" font-weight="600">Relational Database</text>

  <!-- Accent indicator -->
  <circle cx="222" cy="34" r="3" fill="#336791" />
</svg>
