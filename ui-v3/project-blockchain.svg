<svg xmlns="http://www.w3.org/2000/svg" width="480" height="226" viewBox="0 0 480 226" role="img" aria-label="Blockchain Certificate Verification">
  <title>Blockchain Certificate Verification</title>
  <defs>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="projBorder6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3b341" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect x="2" y="2" width="476" height="222" rx="12" fill="url(#cardGrad6)" stroke="url(#projBorder6)" stroke-width="1.6" />

  <!-- Top bar -->
  <path d="M 2 12 C 2 6.477 6.477 2 12 2 L 468 2 C 473.523 2 478 6.477 478 12 L 478 32 L 2 32 Z" fill="#21262d" />
  <circle cx="16" cy="17" r="3.5" fill="#ff5f56" />
  <circle cx="28" cy="17" r="3.5" fill="#ffbd2e" />
  <circle cx="40" cy="17" r="3.5" fill="#27c93f" />
  <text x="56" y="21" class="mono" font-size="10.5" fill="#8b949e">github // Blockchain-Certificate</text>
  
  <rect x="345" y="7" width="122" height="18" rx="4" fill="#302613" stroke="#e3b341" stroke-width="1" />
  <text x="406" y="19" text-anchor="middle" class="mono" font-size="9" fill="#e3b341" font-weight="700">● ETHEREUM / WEB3</text>

  <!-- Project Title -->
  <text x="20" y="62" class="sans" font-size="18" font-weight="800" fill="#f0f6fc">Blockchain Certificate System</text>
  <text x="20" y="80" class="mono" font-size="11" fill="#e3b341" font-weight="600">Decentralized Credential Verification</text>

  <!-- Description -->
  <text x="20" y="106" class="sans" font-size="12" fill="#c9d1d9">
    Tamper-proof academic credential authentication engine leveraging
  </text>
  <text x="20" y="124" class="sans" font-size="12" fill="#c9d1d9">
    Ethereum smart contracts &amp; SHA-256 cryptographic hashing.
  </text>
  <text x="20" y="142" class="sans" font-size="12" fill="#c9d1d9">
    Enables instant, verifiable on-chain validation preventing certificate fraud.
  </text>

  <!-- Tech tags -->
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#21262d" />
    <text x="30" y="15" text-anchor="middle" class="mono" font-size="10" fill="#f2cc60">Solidity</text>

    <rect x="66" y="0" width="70" height="22" rx="4" fill="#21262d" />
    <text x="101" y="15" text-anchor="middle" class="mono" font-size="10" fill="#f2cc60">Ethereum</text>

    <rect x="142" y="0" width="56" height="22" rx="4" fill="#21262d" />
    <text x="170" y="15" text-anchor="middle" class="mono" font-size="10" fill="#f2cc60">Web3.js</text>

    <rect x="204" y="0" width="105" height="22" rx="4" fill="#21262d" />
    <text x="256" y="15" text-anchor="middle" class="mono" font-size="10" fill="#f2cc60">Smart Contracts</text>
  </g>

  <!-- Link CTA Badge -->
  <g transform="translate(365, 168)">
    <rect x="0" y="0" width="95" height="22" rx="4" fill="#d29922" />
    <text x="47" y="15" text-anchor="middle" class="sans" font-size="10.5" fill="#000000" font-weight="700">GitHub ↗</text>
