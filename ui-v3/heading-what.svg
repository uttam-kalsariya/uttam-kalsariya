<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="72" viewBox="0 0 1000 72" role="img" aria-label="What I Do">
  <title>What I Do</title>
  <defs>
    <linearGradient id="glowWhat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#f0883e" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#2ea043" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  </style>
  <rect x="1" y="1" width="998" height="70" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Index Pill -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="125" height="32" rx="16" fill="#161b22" stroke="#f0883e" stroke-width="1.2" />
    <circle cx="16" cy="16" r="4" fill="#f0883e" />
    <text x="28" y="21" class="mono" font-size="12" fill="#f0883e" font-weight="700">07 // DOMAINS</text>
  </g>

  <!-- Title Text -->
  <text x="168" y="44" class="sans" font-size="22" font-weight="800" fill="#f0f6fc" letter-spacing="1">
    WHAT <tspan fill="#f0883e">I DO</tspan>
  </text>
  <text x="310" y="44" class="mono" font-size="13" fill="#8b949e">
    // specialized engineering domains &amp; core disciplines
  </text>

  <!-- Right Pill -->
  <g transform="translate(810, 20)">
    <rect x="0" y="0" width="165" height="32" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="14" y="21" class="mono" font-size="11" fill="#79c0ff" font-weight="600">&lt;expertise_areas /&gt;</text>
  </g>

  <!-- Glowing Bottom Accent Line -->
  <rect x="20" y="69" width="960" height="2" fill="url(#glowWhat)" />
</svg>
