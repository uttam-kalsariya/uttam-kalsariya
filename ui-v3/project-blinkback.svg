  <rect x="2" y="2" width="476" height="222" rx="12" fill="url(#cardGrad2)" stroke="url(#projBorder2)" stroke-width="1.6" />

  <!-- Top bar -->
  <path d="M 2 12 C 2 6.477 6.477 2 12 2 L 468 2 C 473.523 2 478 6.477 478 12 L 478 32 L 2 32 Z" fill="#21262d" />
  <circle cx="16" cy="17" r="3.5" fill="#ff5f56" />
  <circle cx="28" cy="17" r="3.5" fill="#ffbd2e" />
  <circle cx="40" cy="17" r="3.5" fill="#27c93f" />
  <text x="56" y="21" class="mono" font-size="10.5" fill="#8b949e">playstore // blinkback_wellness.apk</text>
  
  <rect x="345" y="7" width="122" height="18" rx="4" fill="#1b2e20" stroke="#238636" stroke-width="1" />
