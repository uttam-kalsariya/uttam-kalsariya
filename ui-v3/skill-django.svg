<svg xmlns="http://www.w3.org/2000/svg" width="242" height="68" viewBox="0 0 242 68" role="img" aria-label="Django">
  <title>Django</title>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <rect x="1" y="1" width="240" height="66" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect x="1" y="1" width="240" height="66" rx="10" fill="#161b22" opacity="0.6" />
  
  <!-- Django Badge Icon -->
  <g transform="translate(18, 17)">
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#092e20" stroke="#44b78b" stroke-width="1" />
    <text x="17" y="24" text-anchor="middle" class="sans" font-size="20" font-weight="900" fill="#44b78b">dj</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="64" y="30" class="sans" font-size="15" font-weight="700" fill="#f0f6fc">Django</text>
  <text x="64" y="48" class="mono" font-size="10.5" fill="#44b78b" font-weight="600">Full-Stack &amp; DRF</text>

  <!-- Accent indicator -->
  <circle cx="222" cy="34" r="3" fill="#44b78b" />
</svg>
