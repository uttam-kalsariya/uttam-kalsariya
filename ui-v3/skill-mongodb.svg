<svg xmlns="http://www.w3.org/2000/svg" width="242" height="68" viewBox="0 0 242 68" role="img" aria-label="MongoDB">
  <title>MongoDB</title>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <rect x="1" y="1" width="240" height="66" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect x="1" y="1" width="240" height="66" rx="10" fill="#161b22" opacity="0.6" />
  
  <!-- MongoDB Leaf Icon -->
  <g transform="translate(18, 17)">
    <circle cx="17" cy="17" r="17" fill="#13aa52" opacity="0.2" />
    <path d="M 17 4 C 17 4 11 11 11 18 C 11 23 15 27 17 30 C 19 27 23 23 23 18 C 23 11 17 4 17 4 Z" fill="#13aa52" />
