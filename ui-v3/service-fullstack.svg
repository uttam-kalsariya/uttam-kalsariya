  <rect x="1" y="1" width="478" height="163" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.3" />
  <rect x="1" y="1" width="478" height="163" rx="12" fill="#161b22" opacity="0.6" />

  <!-- Icon Circle -->
  <g transform="translate(22, 22)">
