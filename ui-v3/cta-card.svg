<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Let's work together">
  <title>Let's work together</title>
  <style>
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; white-space: pre; }
    .m { font-size: 17px; font-weight: bold; }
  </style>
  <defs>
    <linearGradient id="rb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff5f6d" />
      <stop offset=".2" stop-color="#ffc371" />
      <stop offset=".4" stop-color="#7ee787" />
      <stop offset=".6" stop-color="#58a6ff" />
      <stop offset=".8" stop-color="#bc8cff" />
      <stop offset="1" stop-color="#ff5f6d" />
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" />
      <stop offset=".5" stop-color="#bc8cff" />
      <stop offset="1" stop-color="#ff7bb0" />
    </linearGradient>

    <clipPath id="c0">
      <rect x="300" y="32.0" width="400" height="40">
        <animate attributeName="width" values="0;400" dur="2s" fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="c1">
      <rect x="160" y="74.0" width="680" height="40">
        <animate attributeName="width" values="0;680" dur="3s" fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="c2">
      <rect x="250" y="110.0" width="500" height="40">
        <animate attributeName="width" values="0;500" dur="4s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect x=".5" y=".5" width="999" height="189" rx="12" fill="#0d1117" stroke="url(#bd)" stroke-width="1.5" />

  <text class="m" fill="url(#rb)" x="320.6" y="62.0" textLength="358.8" lengthAdjust="spacing" clip-path="url(#c0)" style="font-size:26px;font-weight:bold">Have&#160;a&#160;project&#160;in&#160;mind?</text>
  <text class="m" fill="#c9d1d9" x="183.8" y="104.0" textLength="632.4" lengthAdjust="spacing" clip-path="url(#c1)" style="font-size:17px;font-weight:bold">I&#x27;m&#160;open&#160;to&#160;freelance&#160;work,&#160;full-time&#160;roles&#160;and&#160;collaboration.</text>
  <text class="m" fill="#7ee787" x="265.4" y="140.0" textLength="469.2" lengthAdjust="spacing" clip-path="url(#c2)" style="font-size:17px;font-weight:bold">Send&#160;me&#160;a&#160;message&#160;and&#160;let&#x27;s&#160;build&#160;it&#160;together.</text>
</svg>
