<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Let's build something extraordinary together">
  <title>Let's build something extraordinary together</title>
  <defs>
    <linearGradient id="ctaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect x="2" y="2" width="996" height="196" rx="14" fill="url(#ctaBg)" stroke="url(#ctaBorder)" stroke-width="1.8" />

  <!-- Top bar -->
  <path d="M 2 14 C 2 7.373 7.373 2 14 2 L 986 2 C 992.627 2 998 7.373 998 14 L 998 34 L 2 34 Z" fill="#21262d" />
  <circle cx="20" cy="18" r="4" fill="#ff5f56" />
  <circle cx="34" cy="18" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="18" r="4" fill="#27c93f" />
  <text x="70" y="22" class="mono" font-size="11" fill="#8b949e">contract_proposal.sh // hire_engineer</text>
  <text x="960" y="22" text-anchor="end" class="mono" font-size="11" fill="#3fb950" font-weight="700">● INBOX OPEN</text>

  <!-- Content -->
  <g transform="translate(40, 64)">
    <text x="0" y="20" class="sans" font-size="24" font-weight="900" fill="#f0f6fc">
      Have an ambitious project or an engineering role to fill?
    </text>
    <text x="0" y="48" class="sans" font-size="14.5" fill="#c9d1d9">
      Whether you need robust Python backend microservices, cross-platform Flutter applications,
    </text>
    <text x="0" y="68" class="sans" font-size="14.5" fill="#c9d1d9">
      or end-to-end full-stack architectures — let's connect and build software that scales.
    </text>

    <!-- Bottom Feature Chips -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="160" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="12" y="16" class="mono" font-size="10.5" fill="#3fb950" font-weight="700">✓ IMMEDIATE AVAILABILITY</text>

      <rect x="175" y="0" width="165" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="12" y="16" class="mono" font-size="10.5" fill="#38bdf8" font-weight="700">✓ BENGALURU &amp; REMOTE</text>

      <rect x="355" y="0" width="175" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="12" y="16" class="mono" font-size="10.5" fill="#d2a8ff" font-weight="700">✓ PRODUCTION CODE QUALITY</text>
    </g>
  </g>
</svg>
