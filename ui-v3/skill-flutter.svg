<svg xmlns="http://www.w3.org/2000/svg" width="242" height="68" viewBox="0 0 242 68" role="img" aria-label="Flutter">
  <title>Flutter</title>
  <defs>
    <linearGradient id="flutterShadow" gradientUnits="userSpaceOnUse" x1="23.3" y1="23.6" x2="27.8" y2="19.1">
      <stop offset="0" stop-color="#1a237e" stop-opacity="0.4" />
      <stop offset="1" stop-color="#1a237e" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect x="1" y="1" width="240" height="66" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect x="1" y="1" width="240" height="66" rx="10" fill="#161b22" opacity="0.6" />

  <!-- Official Flutter Multi-Color Vector Logo -->
  <g transform="translate(16, 15) scale(0.59)">
    <!-- Top Right Slash -->
    <path d="M 37.5 1.2 L 7.1 31.6 L 16.5 41 L 56.2 1.2 Z" fill="#39cefd" />
    <!-- Center Lower Chevron -->
    <path d="M 21.2 45.7 L 30.6 55.1 L 56.2 29.4 L 37.5 29.4 Z" fill="#39cefd" />
    <!-- Bottom Right Wing -->
    <path d="M 30.6 55.1 L 37.6 62.1 L 56.2 62.1 L 39.9 45.7 Z" fill="#03569b" />
    <!-- Center Diamond -->
    <path d="M 21.2 45.7 L 30.6 36.3 L 39.9 45.7 L 30.6 55.1 Z" fill="#16b9fd" />
    <!-- Gradient Shadow -->
    <path d="M 44.4 50.3 L 39.9 45.7 L 30.6 55.1 Z" fill="url(#flutterShadow)" />
  </g>

  <!-- Title & Subtitle -->
  <text x="64" y="30" class="sans" font-size="15" font-weight="700" fill="#f0f6fc">Flutter</text>
  <text x="64" y="48" class="mono" font-size="10.5" fill="#47c5fb" font-weight="600">Mobile Engineering</text>

  <!-- Accent indicator -->
  <circle cx="222" cy="34" r="3" fill="#02569b" />
</svg>
