<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Uttam Kalsariya — Full Stack Software Engineer">
  <title>Uttam Kalsariya — Full Stack Software Engineer</title>
  <defs>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#2ea043">
        <animate attributeName="stop-color" values="#2ea043;#38bdf8;#a855f7;#ec4899;#2ea043" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7ee787" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#1c2128" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    .cursor-blink { animation: blink 1s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="996" height="396" rx="16" fill="url(#bgGrad)" stroke="url(#cyberBorder)" stroke-width="2.5" />
  <rect x="2" y="2" width="996" height="396" rx="16" fill="url(#grid)" />

  <!-- Terminal Window Bar -->
  <path d="M 2 18 C 2 9.163 9.163 2 18 2 L 982 2 C 990.837 2 998 9.163 998 18 L 998 44 L 2 44 Z" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="24" cy="23" r="6" fill="#ff5f56" />
  <circle cx="44" cy="23" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="23" r="6" fill="#27c93f" />

  <text x="500" y="28" text-anchor="middle" class="mono" font-size="12" fill="#8b949e" font-weight="600">uttam@developer-node: ~/portfolio (main)</text>

  <!-- Live Status Pill Top Right -->
  <g transform="translate(805, 13)">
    <rect x="0" y="0" width="172" height="22" rx="11" fill="#0d1117" stroke="#238636" stroke-width="1" />
    <circle cx="14" cy="11" r="4" fill="#3fb950" class="pulse-dot" />
    <text x="26" y="15.5" class="mono" font-size="10.5" fill="#3fb950" font-weight="700">SYSTEM: ONLINE</text>
  </g>

  <!-- Status & Geo Badges Row -->
  <g transform="translate(50, 68)">
    <!-- Location Badge -->
    <rect x="0" y="0" width="155" height="28" rx="7" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="14" y="18.5" class="sans" font-size="12" fill="#c9d1d9" font-weight="600">📍 Bengaluru, India</text>

    <!-- Role Status -->
    <rect x="165" y="0" width="235" height="28" rx="7" fill="#1b2e20" stroke="#238636" stroke-width="1" />
    <text x="179" y="18.5" class="mono" font-size="11" fill="#3fb950" font-weight="700">🟢 OPEN FOR FULL-TIME ROLES</text>

    <!-- Scholar Badge (Generous width to prevent any clipping) -->
    <rect x="410" y="0" width="220" height="28" rx="7" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="424" y="18.5" class="sans" font-size="12" fill="#e6edf3" font-weight="600">🎓 MSc IT Scholar (2027)</text>
  </g>

  <!-- Hero Header Title -->
  <g transform="translate(50, 142)">
    <text x="0" y="0" class="sans" font-size="44" font-weight="900" fill="#f0f6fc" letter-spacing="-1">
      UTTAM <tspan fill="url(#textGrad)">KALSARIYA</tspan>
    </text>
    <text x="0" y="32" class="sans" font-size="18" font-weight="600" fill="#58a6ff" letter-spacing="0.5">
      Full Stack Software Engineer · Python Backend · Flutter Mobile Developer
    </text>
    <text x="0" y="58" class="sans" font-size="14" fill="#8b949e">
      Building robust backend services, scalable REST APIs, reactive mobile apps &amp; applied AI workflows.
    </text>
  </g>

  <!-- Interactive Terminal Prompt Box -->
  <g transform="translate(50, 236)">
    <rect x="0" y="0" width="900" height="50" rx="8" fill="#090d13" stroke="#30363d" stroke-width="1" />
    <!-- Prompt symbol -->
    <text x="16" y="30" class="mono" font-size="15" fill="#3fb950" font-weight="700">$</text>
    <text x="34" y="30" class="mono" font-size="13.5" fill="#79c0ff">stack.explore --focus</text>
    <text x="210" y="30" class="mono" font-size="13.5" fill="#8b949e">["Python", "Django", "Flutter", "FastAPI", "PostgreSQL", "OpenCV"]</text>
    <rect x="760" y="17" width="8" height="17" fill="#58a6ff" class="cursor-blink" />
  </g>

  <!-- Quick Highlight Metric Chips (Calibrated 215px width & proportionate fonts to prevent any text overflow) -->
  <g transform="translate(50, 306)">
    <!-- Chip 1: Google Play Store -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="215" height="68" rx="10" fill="url(#chipBg)" stroke="#30363d" stroke-width="1.2" />
      <circle cx="16" cy="22" r="3" fill="#3fb950" />
      <text x="25" y="25" class="sans" font-size="10.5" fill="#8b949e" font-weight="700" letter-spacing="0.5">GOOGLE PLAY STORE</text>
      <text x="16" y="51" class="sans" font-size="15" fill="#3fb950" font-weight="800">2+ Live Published Apps</text>
    </g>

    <!-- Chip 2: Mobile Utility Suite -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="215" height="68" rx="10" fill="url(#chipBg)" stroke="#30363d" stroke-width="1.2" />
      <circle cx="16" cy="22" r="3" fill="#38bdf8" />
      <text x="25" y="25" class="sans" font-size="10.5" fill="#8b949e" font-weight="700" letter-spacing="0.5">MOBILE UTILITY SUITE</text>
      <text x="16" y="51" class="sans" font-size="15" fill="#38bdf8" font-weight="800">200+ Calculators Built</text>
    </g>

    <!-- Chip 3: Industry Experience -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="215" height="68" rx="10" fill="url(#chipBg)" stroke="#30363d" stroke-width="1.2" />
      <circle cx="16" cy="22" r="3" fill="#bc8cff" />
      <text x="25" y="25" class="sans" font-size="10.5" fill="#8b949e" font-weight="700" letter-spacing="0.5">INDUSTRY EXPERIENCE</text>
      <text x="16" y="51" class="sans" font-size="14.5" fill="#bc8cff" font-weight="800">Seravion &amp; IncodeVision</text>
    </g>

    <!-- Chip 4: System Architecture -->
    <g transform="translate(684, 0)">
      <rect x="0" y="0" width="215" height="68" rx="10" fill="url(#chipBg)" stroke="#30363d" stroke-width="1.2" />
      <circle cx="16" cy="22" r="3" fill="#f0883e" />
      <text x="25" y="25" class="sans" font-size="10.5" fill="#8b949e" font-weight="700" letter-spacing="0.5">SYSTEM ARCHITECTURE</text>
      <text x="16" y="51" class="sans" font-size="14.5" fill="#f0883e" font-weight="800">REST APIs &amp; Applied AI</text>
    </g>
  </g>
</svg>
