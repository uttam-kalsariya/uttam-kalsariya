<svg xmlns="http://www.w3.org/2000/svg" width="330" height="76" viewBox="0 0 330 76" role="img" aria-label="Google Play Store">
  <title>Google Play Store</title>
  <defs>
    <linearGradient id="gpBlue" y2="434.291" x2="100.359" y1="319.454" x1="215.196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00a0ff" />
      <stop offset=".26" stop-color="#00beff" />
      <stop offset=".76" stop-color="#00dfff" />
      <stop offset="1" stop-color="#00e3ff" />
    </linearGradient>

    <linearGradient id="gpYellow" y2="396.75" x2="132.007" y1="396.75" x1="297.578" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe000" />
      <stop offset=".409" stop-color="#ffbd00" />
      <stop offset=".775" stop-color="#ff9c00" />
      <stop offset="1" stop-color="#ff8400" />
    </linearGradient>

    <linearGradient id="gpRed" y2="568.208" x2="80.242" y1="412.481" x1="235.969" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3a44" />
      <stop offset="1" stop-color="#c31162" />
    </linearGradient>

    <linearGradient id="gpGreen" y2="330.609" x2="185.559" y1="261.07" x1="116.02" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32a071" />
      <stop offset=".476" stop-color="#15cf74" />
      <stop offset="1" stop-color="#00f076" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect x="1" y="1" width="328" height="74" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect x="1" y="1" width="328" height="74" rx="10" fill="#161b22" opacity="0.6" />

  <!-- Official Google Play Vector Logo -->
  <g transform="translate(18, 18)">
    <svg x="0" y="0" width="40" height="40" viewBox="134 307.5 32 32">
      <!-- Blue Wing -->
      <path d="M137.5 311.5c-2 2.1-3.2 5.4-3.2 9.6v151.3c0 4.2 1.2 7.5 3.2 9.6l.5.5 84.8-84.8v-2L138 310.9z" fill="url(#gpBlue)" />
      <!-- Yellow Right Triangle -->
      <path d="M251 426l-28.2-28.3v-2l28.3-28.3.6.4 33.5 19c9.6 5.4 9.6 14.3 0 19.8l-33.5 19z" fill="url(#gpYellow)" />
      <!-- Red Bottom Wing -->
      <path d="M251.7 425.6l-28.9-28.9-85.3 85.3c3.1 3.3 8.4 3.8 14.2.4l100-56.8" fill="url(#gpRed)" />
      <!-- Green Top Wing -->
      <path d="M251.7 367.9l-100-56.8c-5.9-3.3-11.1-2.9-14.2.4l85.3 85.3z" fill="url(#gpGreen)" />
    </svg>
  </g>

  <!-- Title & Handle -->
  <text x="70" y="34" class="sans" font-size="15" font-weight="700" fill="#f0f6fc">Google Play Store</text>
  <text x="70" y="52" class="mono" font-size="11" fill="#3fb950">Uttam Kalsariya (Dev)</text>

  <!-- Arrow -->
  <text x="304" y="44" class="sans" font-size="18" fill="#8b949e">↗</text>
</svg>
