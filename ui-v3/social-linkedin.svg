<svg xmlns="http://www.w3.org/2000/svg" width="330" height="76" viewBox="0 0 330 76" role="img" aria-label="LinkedIn">
  <title>LinkedIn</title>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <rect x="1" y="1" width="328" height="74" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect x="1" y="1" width="328" height="74" rx="10" fill="#161b22" opacity="0.6" />

  <!-- LinkedIn Logo -->
  <g transform="translate(18, 18)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#0a66c2" />
    <text x="20" y="27" text-anchor="middle" class="sans" font-size="22" font-weight="900" fill="#ffffff">in</text>
  </g>

  <!-- Title & Handle -->
  <text x="70" y="34" class="sans" font-size="15" font-weight="700" fill="#f0f6fc">LinkedIn</text>
  <text x="70" y="52" class="mono" font-size="11" fill="#79c0ff">in/uttam-kalsariya</text>

  <!-- Arrow -->
  <text x="304" y="44" class="sans" font-size="18" fill="#8b949e">↗</text>
</svg>
