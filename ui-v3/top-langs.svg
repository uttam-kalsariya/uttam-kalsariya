<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <clipPath id="barClip">
      <rect x="60" y="105" width="880" height="18" rx="9" />
    </clipPath>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4AB" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3572A5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A97BFF" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="996" height="276" rx="14" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="500" y="62" text-anchor="middle" class="sans" font-size="28" font-weight="800" fill="#70a5fd" letter-spacing="0.5">Most Used Languages</text>

  <!-- Segmented Progress Bar -->
  <g clip-path="url(#barClip)">
    <!-- Dart: 34.50% (width: 303.6) -->
    <rect x="60" y="105" width="303.6" height="18" fill="#00B4AB" />
    <!-- Python: 26.20% (width: 230.56) -->
    <rect x="363.6" y="105" width="230.56" height="18" fill="#3572A5" />
    <!-- JavaScript: 16.80% (width: 147.84) -->
    <rect x="594.16" y="105" width="147.84" height="18" fill="#f1e05a" />
    <!-- HTML: 10.50% (width: 92.4) -->
    <rect x="742" y="105" width="92.4" height="18" fill="#e34c26" />
    <!-- CSS: 6.20% (width: 54.56) -->
    <rect x="834.4" y="105" width="54.56" height="18" fill="#563d7c" />
    <!-- Kotlin: 5.80% (width: 51.04) -->
    <rect x="888.96" y="105" width="51.04" height="18" fill="#A97BFF" />
  </g>

  <!-- Language List: Two-Column Grid -->
  <!-- Left Column -->
  <!-- 1. Dart -->
  <g transform="translate(130, 162)">
    <circle cx="0" cy="0" r="7.5" fill="#00B4AB" />
    <text x="22" y="6" class="sans" font-size="18" font-weight="700" fill="#f0f6fc">Dart <tspan font-weight="500" fill="#79c0ff">34.50%</tspan></text>
  </g>

  <!-- 2. Python -->
  <g transform="translate(130, 202)">
    <circle cx="0" cy="0" r="7.5" fill="#3572A5" />
    <text x="22" y="6" class="sans" font-size="18" font-weight="700" fill="#f0f6fc">Python <tspan font-weight="500" fill="#79c0ff">26.20%</tspan></text>
  </g>

  <!-- 3. JavaScript -->
  <g transform="translate(130, 242)">
    <circle cx="0" cy="0" r="7.5" fill="#f1e05a" />
    <text x="22" y="6" class="sans" font-size="18" font-weight="700" fill="#f0f6fc">JavaScript <tspan font-weight="500" fill="#79c0ff">16.80%</tspan></text>
  </g>

  <!-- Right Column -->
  <!-- 4. HTML -->
  <g transform="translate(560, 162)">
    <circle cx="0" cy="0" r="7.5" fill="#e34c26" />
    <text x="22" y="6" class="sans" font-size="18" font-weight="700" fill="#f0f6fc">HTML <tspan font-weight="500" fill="#79c0ff">10.50%</tspan></text>
  </g>

  <!-- 5. CSS -->
  <g transform="translate(560, 202)">
    <circle cx="0" cy="0" r="7.5" fill="#563d7c" />
    <text x="22" y="6" class="sans" font-size="18" font-weight="700" fill="#f0f6fc">CSS <tspan font-weight="500" fill="#79c0ff">6.20%</tspan></text>
  </g>

  <!-- 6. Kotlin -->
  <g transform="translate(560, 242)">
    <circle cx="0" cy="0" r="7.5" fill="#A97BFF" />
    <text x="22" y="6" class="sans" font-size="18" font-weight="700" fill="#f0f6fc">Kotlin <tspan font-weight="500" fill="#79c0ff">5.80%</tspan></text>
  </g>
</svg>
